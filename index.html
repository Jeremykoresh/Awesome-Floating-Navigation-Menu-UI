<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Magic Navigation Menu</title>
  <style>

    :root{
      --bg1:#046c68;
      --bg2:#4ba478;
      --menu:#050505;
      --text:#feffff;
      --active:#f4fffd;
      --accent:#95ffe2;
      --accent2:#d6fff6;
      --shadow: rgba(0, 0, 0, 0.9);
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body{
      min-height:100vh;
      display:grid;
      place-items:center;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 20% 10%, rgba(255,255,255,.18), transparent 30%),
        radial-gradient(circle at 80% 90%, rgba(255,255,255,.12), transparent 28%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
      overflow:hidden;
    }

    .wrap{
      width:min(100%, 460px);
      padding:20px 14px;
    }

    .nav-shell{
      position:relative;
      width:100%;
      height:100px;
      border-radius:30px;
      background: rgba(0,0,0,.97);
      box-shadow:
        0 20px 50px var(--shadow),
        inset 0 1px 0 rgba(255,255,255,.08);
      overflow:visible;
    }




    .nav-shell::before{
      content:"";
      position:absolute;
      inset:0;
      border-radius:30px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.08), transparent 28%),
        radial-gradient(circle at 50% 0%, rgba(255,255,255,.08), transparent 35%);
      pointer-events:none;
    }

    .menu{
      position:relative;
      z-index:2;
      list-style:none;
      width:100%;
      height:100%;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 12px;
    }

    .menu li{
      position:relative;
      width:25%;
      height:80%;
    }

    .menu a{
      width:100%;
      height:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-decoration:none;
      position:relative;
      color:var(--text);
      user-select:none;
    }

    .icon{
      width:52px;
      height:52px;
      display:grid;
      place-items:center;
      border-radius:50%;
      transition:
        transform .45s cubic-bezier(.2,.9,.2,1),
        color .35s ease,
        opacity .35s ease;
      opacity:.92;
      z-index:3;
    }




    .icon svg{
      width:28px;
      height:30px;
      fill:none;
      stroke:currentColor;
      stroke-width:2.4;
      stroke-linecap:round;
      stroke-linejoin:round;
      filter: drop-shadow(0 0 6px rgba(255,255,255,.08));
    }

    .text{
      position:absolute;
      bottom:11px;
      font-size:12px;
      letter-spacing:1.5px;
      text-transform:uppercase;
      opacity:0;
      transform:translateY(10px);
      transition: opacity .35s ease, transform .35s ease, color .35s ease;
      color:var(--text);
      pointer-events:none;
    }

    .menu li.active .icon{
      transform:translateY(-35px) scale(1.06);
      color:var(--active);
    }

    .menu li.active .text{
      opacity:1;
      transform:translateY(0);
      color:var(--active);
    }

    .indicator{
      position:absolute;
      top:-25px;
      left:0;
      width:76px;
      height:76px;
      border-radius:50%;
      z-index:1;
      pointer-events:none;
      opacity:0;
      transform:translateX(0) scale(.85);
      transition:
        transform .48s cubic-bezier(.2,.95,.18,1),
        width .35s ease,
        height .35s ease,
        opacity .2s ease;
      background:
        radial-gradient(circle at 32% 28%, rgba(255,255,255,.32), transparent 22%),
        radial-gradient(circle at 50% 52%, rgba(255,255,255,.08), transparent 50%),
        linear-gradient(180deg, #1b1b1b 0%, #080808 100%);
      border: 1.5px solid rgba(235,255,251,.82);
      box-shadow:
        0 0 0 6px rgba(255,255,255,.05),
        0 0 28px rgba(149,255,226,.16),
        0 14px 26px rgba(0,0,0,.35),
        inset 0 1px 10px rgba(255,255,255,.08),
        inset 0 -12px 18px rgba(0,0,0,.35);
    }






    .nav-shell.show-indicator .indicator{
      opacity:1;
      transform:translateX(0) scale(1);
    }

    .indicator::before{
      content:"";
      position:absolute;
      inset:10px;
      border-radius:50%;
      border:1px solid rgba(255,255,255,.12);
      box-shadow:
        inset 0 0 18px rgba(255,255,255,.04),
        inset 0 -8px 18px rgba(0,0,0,.18);
    }

    .indicator::after{
      content:"";
      position:absolute;
      inset:-8px;
      border-radius:50%;
      background: radial-gradient(circle, rgba(149,255,226,.18), transparent 60%);
      filter: blur(6px);
      opacity:.9;
      z-index:-1;
    }

    .menu li.active .icon svg{
      stroke:var(--active);
    }

    @media (max-width: 420px){
      .nav-shell{ height:84px; }
      .icon{ width:48px; height:48px; }
      .icon svg{ width:26px; height:26px; }
      .indicator{
        width:70px;
        height:70px;
        top:-31px;
      }
      .menu li.active .icon{
        transform:translateY(-26px) scale(1.05);
      }
    }



  </style>
</head>
<body>



  <div class="wrap">
    <nav class="nav-shell" id="navShell">
      <div class="indicator" id="indicator"></div>
      <ul class="menu" id="menu">
        <li>
          <a href="#" aria-label="Home">
            <span class="icon">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 11.2L12 4l9 7.2"></path>
                <path d="M5.5 10.8V20h13v-9.2"></path>
                <path d="M9.5 20v-6h5v6"></path>
              </svg>
            </span>
            <span class="text">Home</span>
          </a>
        </li>
        <li>
          <a href="#" aria-label="About">
            <span class="icon">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="8" r="3.2"></circle>
                <path d="M6.5 20c1.2-3.6 4-5.5 5.5-5.5s4.3 1.9 5.5 5.5"></path>
              </svg>
            </span>
            <span class="text">About</span>
          </a>
        </li>




        <li> 
          <a href="#" aria-label="Menu">
            <span class="icon">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 7h16"></path>
                <path d="M4 12h16"></path>
                <path d="M4 17h16"></path>
              </svg>
            </span>
            <span class="text">Menu</span>
          </a>
        </li>
        <li>
          <a href="#" aria-label="Settings">
            <span class="icon">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="3.2"></circle>
                <path 
                  d="M19 12a7 7 0 0 0-.1-1l2-1.5-1.8-3.1-2.4.9a7 
                     7 0 0 0-1.7-1l-.4-2.5H9.4L9 5.3a7 7 0 0 0-1.7 
                     1l-2.4-.9-1.8 3.1L5.1 11a7 7 0 0 0 0 2l-2 1.5 
                     1.8 3.1 2.4-.9a7 7 0 0 0 1.7 1l.4 2.5h4.2l.4-2.5a7 
                      7 0 0 0 1.7-1l2.4.9 1.8-3.1-2-1.5c.1-.3.1-.7.1-1z">
              </path>
              </svg>
            </span>
            <span class="text">Settings</span>
          </a>
        </li>
      </ul>
    </nav>
  </div>




  <script>
    const navShell = document.getElementById("navShell");
    const menu = document.getElementById("menu");
    const indicator = document.getElementById("indicator");
    const items = [...document.querySelectorAll(".menu li")];
    function moveIndicator(item) {
      const menuRect = menu.getBoundingClientRect();
      const itemRect = item.getBoundingClientRect();
      const centerX = itemRect.left - menuRect.left + itemRect.width / 2;
      const indicatorWidth = indicator.offsetWidth;
      indicator.style.transform = `translateX(${centerX - indicatorWidth / 2}px) scale(1)`;
    }
    function setActive(item) {
      items.forEach(li => li.classList.remove("active"));
      item.classList.add("active");
      navShell.classList.add("show-indicator");
      moveIndicator(item);
    }
    items.forEach((item) => {
      const link = item.querySelector("a");

      link.addEventListener("click", (e) => {
        e.preventDefault();
        setActive(item);
      });
    });
    window.addEventListener("resize", () => {
      const active = document.querySelector(".menu li.active");
      if (active) {
        navShell.classList.add("show-indicator");
        moveIndicator(active);
      }
    });
  </script>



</body>
</html>
